name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, xmlwriter, xsl, zip
          coverage: none
      - run: composer install --no-interaction --no-progress
      - name: Lint
        run: find src build tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Unit tests
        run: vendor/bin/phpunit
      - name: Build package
        run: php build/build.php

  joomla:
    name: Joomla ${{ matrix.joomla }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - joomla: '5.4.11'
            php: '8.1'
          - joomla: '6.2.1'
            php: '8.4'
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, intl, mbstring, mysqli, xml, zip
          coverage: none
      - name: Build package
        run: php build/build.php
      - name: Install Joomla
        run: |
          curl -sSfL -o joomla.zip "https://github.com/joomla/joomla-cms/releases/download/${{ matrix.joomla }}/Joomla_${{ matrix.joomla }}-Stable-Full_Package.zip"
          mkdir site && unzip -q joomla.zip -d site
          php site/installation/joomla.php install -n --site-name="Test Site" --admin-user=Admin --admin-username=admin \
            --admin-password=AdminPass1234 --admin-email=admin@example.com --db-type=mysqli --db-host=127.0.0.1 \
            --db-user=root --db-pass=root --db-name=joomla --db-prefix=jt_ --db-encryption=0
          php site/cli/joomla.php config:set -n live_site=http://127.0.0.1:8765 sef_rewrite=true unicodeslugs=true
      - name: Create test content
        run: php tests/Integration/setup-content.php site
      - name: Install the package and check console, scheduler and HTML page
        run: |
          version=$(php -r 'echo simplexml_load_file("src/pkg_qrzlitesitemap.xml")->version;')
          bash tests/Integration/smoke.sh site "dist/pkg_qrzlitesitemap-$version.zip" http://127.0.0.1:8765

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, joomla]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
      - name: Check the tag matches the version
        run: |
          version=$(php -r 'echo simplexml_load_file("src/pkg_qrzlitesitemap.xml")->version;')
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: php build/build.php
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
