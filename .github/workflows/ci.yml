name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (PHP, HTML, CSS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo_sqlite, xmlwriter, xsl, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/cache@v4
        with:
          path: .cache/joomla
          key: joomla-5.4.11-6.2.1
      - run: composer install --no-interaction --no-progress
      - run: npm ci --no-audit --no-fund
      - name: PHP syntax
        run: composer lint:syntax
      - name: PHP code style
        run: composer lint:style
      - name: PHP static analysis, Joomla 5.4
        run: |
          php build/joomla.php 5.4.11
          JOOMLA_VERSION=5.4.11 vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: PHP static analysis, Joomla 6.2
        run: |
          php build/joomla.php 6.2.1
          vendor/bin/phpstan clear-result-cache -q
          JOOMLA_VERSION=6.2.1 vendor/bin/phpstan analyse --no-progress --memory-limit=1G
      - name: Render the HTML of the layouts and stylesheets
        run: QRZLITE_HTML_OUT=.cache/html JOOMLA_VERSION=6.2.1 vendor/bin/phpunit --no-progress
      - name: HTML and CSS
        run: npm run lint

  test:
    name: Unit tests (PHP ${{ matrix.php }}, Joomla ${{ matrix.joomla }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        joomla: ['5.4.11', '6.2.1']
        exclude:
          # Joomla 6 needs PHP 8.3
          - php: '8.1'
            joomla: '6.2.1'
          - php: '8.2'
            joomla: '6.2.1'
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, pdo_sqlite, xmlwriter, xsl, zip
          coverage: none
      - uses: actions/cache@v4
        with:
          path: .cache/joomla/${{ matrix.joomla }}
          key: joomla-${{ matrix.joomla }}
      - run: composer install --no-interaction --no-progress
      - name: PHP syntax
        run: composer lint:syntax
      - run: php build/joomla.php ${{ matrix.joomla }}
      - name: Unit tests
        run: JOOMLA_VERSION=${{ matrix.joomla }} vendor/bin/phpunit
      - name: Build package
        run: php build/build.php

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, mbstring, pdo_sqlite, xmlwriter, xsl, zip
          coverage: pcov
      - uses: actions/cache@v4
        with:
          path: .cache/joomla/6.2.1
          key: joomla-6.2.1
      - run: composer install --no-interaction --no-progress
      - run: php build/joomla.php 6.2.1
      - name: Unit tests with coverage
        run: JOOMLA_VERSION=6.2.1 vendor/bin/phpunit --coverage-text --coverage-clover .cache/clover.xml
      - name: At least 98% of the statements are run
        run: php build/coverage.php .cache/clover.xml 98

  joomla:
    name: Joomla ${{ matrix.joomla }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - joomla: '5.4.11'
            php: '8.1'
          - joomla: '6.2.1'
            php: '8.4'
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: joomla
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, gd, intl, mbstring, mysqli, xml, zip
          coverage: none
      - name: Build package
        run: php build/build.php
      - name: Install Joomla
        run: |
          curl -sSfL -o joomla.zip "https://github.com/joomla/joomla-cms/releases/download/${{ matrix.joomla }}/Joomla_${{ matrix.joomla }}-Stable-Full_Package.zip"
          mkdir site && unzip -q joomla.zip -d site
          php site/installation/joomla.php install -n --site-name="Test Site" --admin-user=Admin --admin-username=admin \
            --admin-password=AdminPass1234 --admin-email=admin@example.com --db-type=mysqli --db-host=127.0.0.1 \
            --db-user=root --db-pass=root --db-name=joomla --db-prefix=jt_ --db-encryption=0
          php site/cli/joomla.php config:set -n live_site=http://127.0.0.1:8765 sef_rewrite=true unicodeslugs=true
      - name: Create test content
        run: php tests/Integration/setup-content.php site
      - name: Install the package and check console, scheduler and HTML page
        run: |
          version=$(php -r 'echo simplexml_load_file("src/pkg_qrzlitesitemap.xml")->version;')
          bash tests/Integration/smoke.sh site "dist/pkg_qrzlitesitemap-$version.zip" http://127.0.0.1:8765

  # The one check the ruleset of main requires, so the matrices can change without editing the ruleset.
  # It runs even when a job fails, because a skipped required check counts as passed.
  checks:
    name: All checks
    if: always()
    needs: [lint, test, coverage, joomla]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do test "$result" = success; done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, coverage, joomla]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none
      - name: Check the tag matches the version
        run: |
          version=$(php -r 'echo simplexml_load_file("src/pkg_qrzlitesitemap.xml")->version;')
          test "v$version" = "${GITHUB_REF_NAME}"
      - run: php build/build.php
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md."
